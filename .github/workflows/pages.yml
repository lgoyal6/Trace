name: Deploy public evaluation
on:
  push:
    branches: [master]
    paths: ["public-proof/**", "backend/measurement/results/**", "backend/measurement/verify_public_proof.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m backend.measurement.verify_public_proof
      - run: cp backend/measurement/results/retrieval_eval.json public-proof/retrieval_eval.json
      - run: cp backend/measurement/results/grounding_eval.json public-proof/grounding_eval.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-proof
      - id: deployment
        uses: actions/deploy-pages@v4
